AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AI signal to insight to action workshop (initial scaffold)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        LOG_LEVEL: INFO

Parameters:
  StageName:
    Type: String
    Default: dev
  BedrockModelId:
    Type: String
    Default: global.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock model or inference profile ID used by the analyze function.
  UseMockBedrock:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Use deterministic mock analysis instead of invoking Bedrock.
  ForceBedrockFailure:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Force the analyzer failure path for workshop demos and troubleshooting.
  MockInvalidModelOutput:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Force invalid mock model output for validation-failure demos.

Conditions:
  CreateBedrockGuardrail: !Equals [!Ref UseMockBedrock, "false"]

Resources:
  ComplaintsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref StageName

  ComplaintEventsBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: ai-workshop-bus

  WorkshopBedrockGuardrail:
    Type: AWS::Bedrock::Guardrail
    Condition: CreateBedrockGuardrail
    Properties:
      Name: !Sub "${AWS::StackName}-guardrail"
      Description: Workshop guardrail for harmful content and basic PII handling.
      BlockedInputMessaging: Request blocked by workshop guardrail due to policy checks.
      BlockedOutputsMessaging: Response blocked by workshop guardrail due to policy checks.
      ContentPolicyConfig:
        FiltersConfig:
          - Type: HATE
            InputStrength: MEDIUM
            OutputStrength: MEDIUM
          - Type: INSULTS
            InputStrength: MEDIUM
            OutputStrength: MEDIUM
          - Type: VIOLENCE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: MISCONDUCT
            InputStrength: MEDIUM
            OutputStrength: MEDIUM
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - Type: NAME
            Action: ANONYMIZE
          - Type: EMAIL
            Action: ANONYMIZE
          - Type: PHONE
            Action: ANONYMIZE
          - Type: ADDRESS
            Action: ANONYMIZE

  WorkshopBedrockGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Condition: CreateBedrockGuardrail
    Properties:
      Description: Published workshop guardrail version for live Bedrock analysis.
      GuardrailIdentifier: !GetAtt WorkshopBedrockGuardrail.GuardrailId

  RawComplaintsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  InsightsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: complaintId
          AttributeType: S
      KeySchema:
        - AttributeName: complaintId
          KeyType: HASH

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ingest"
      CodeUri: src/ingest/
      Handler: app.lambda_handler
      Description: Accepts complaint submissions, stores raw payloads, and emits event.
      Policies:
        - S3WritePolicy:
            BucketName: !Ref RawComplaintsBucket
        - DynamoDBWritePolicy:
            TableName: !Ref InsightsTable
        - Statement:
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: !GetAtt ComplaintEventsBus.Arn
      Environment:
        Variables:
          RAW_BUCKET_NAME: !Ref RawComplaintsBucket
          INSIGHTS_TABLE_NAME: !Ref InsightsTable
          EVENTS_BUS_NAME: !Ref ComplaintEventsBus
      Events:
        SubmitComplaintApi:
          Type: Api
          Properties:
            RestApiId: !Ref ComplaintsApi
            Path: /complaints
            Method: post

  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-query"
      CodeUri: src/query/
      Handler: app.lambda_handler
      Description: Reads complaint status by complaint ID from DynamoDB.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InsightsTable
      Environment:
        Variables:
          INSIGHTS_TABLE_NAME: !Ref InsightsTable
      Events:
        QueryComplaintApi:
          Type: Api
          Properties:
            RestApiId: !Ref ComplaintsApi
            Path: /complaints/{complaintId}
            Method: get

  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-analyze"
      CodeUri: src/analyze/
      Handler: app.lambda_handler
      Description: Analyzes complaint using Bedrock, applies guardrails, and saves insights.
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref InsightsTable
        - DynamoDBReadPolicy:
            TableName: !Ref InsightsTable
        - S3ReadPolicy:
            BucketName: !Ref RawComplaintsBucket
        - Statement:
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: !GetAtt ComplaintEventsBus.Arn
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:*:*:inference-profile/*"
            - !If
              - CreateBedrockGuardrail
              - Effect: Allow
                Action:
                  - bedrock:ApplyGuardrail
                Resource: !GetAtt WorkshopBedrockGuardrail.GuardrailArn
              - !Ref AWS::NoValue
      Environment:
        Variables:
          INSIGHTS_TABLE_NAME: !Ref InsightsTable
          EVENTS_BUS_NAME: !Ref ComplaintEventsBus
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_GUARDRAIL_ID: !If
            - CreateBedrockGuardrail
            - !GetAtt WorkshopBedrockGuardrailVersion.GuardrailId
            - ""
          BEDROCK_GUARDRAIL_VERSION: !If
            - CreateBedrockGuardrail
            - !GetAtt WorkshopBedrockGuardrailVersion.Version
            - ""
          BEDROCK_REGION: !Ref AWS::Region
          USE_MOCK_BEDROCK: !Ref UseMockBedrock
          FORCE_BEDROCK_FAILURE: !Ref ForceBedrockFailure
          MOCK_INVALID_MODEL_OUTPUT: !Ref MockInvalidModelOutput
          PROMPT_FILE: prompt.txt

  ActionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-action"
      CodeUri: src/action/
      Handler: app.lambda_handler
      Description: Simulates escalation action from analyzed insights.
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref InsightsTable
      Environment:
        Variables:
          INSIGHTS_TABLE_NAME: !Ref InsightsTable
          ACTION_MODE: simulate
          RULE_URGENCY_HIGH: "true"
          RULE_NEGATIVE_COMPLIANCE: "true"
          RULE_PII_AND_NOT_LOW: "true"

  ComplaintSubmittedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-complaint-submitted"
      EventBusName: !Ref ComplaintEventsBus
      EventPattern:
        source:
          - emojot.workshop.complaints
        detail-type:
          - ComplaintReceived
      Targets:
        - Arn: !GetAtt AnalyzeFunction.Arn
          Id: AnalyzeFunctionTarget

  ComplaintAnalyzedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-complaint-analyzed"
      EventBusName: !Ref ComplaintEventsBus
      EventPattern:
        source:
          - emojot.workshop.complaints
        detail-type:
          - ComplaintAnalyzed
      Targets:
        - Arn: !GetAtt ActionFunction.Arn
          Id: ActionFunctionTarget

  AllowEventBridgeInvokeAnalyze:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AnalyzeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ComplaintSubmittedRule.Arn

  AllowEventBridgeInvokeAction:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ActionFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ComplaintAnalyzedRule.Arn

Outputs:
  ApiBaseUrl:
    Description: API base URL for complaint submission and query
    Value: !Sub "https://${ComplaintsApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"

  ApiUrl:
    Description: API endpoint URL for complaint submissions
    Value: !Sub "https://${ComplaintsApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/complaints"

  RawComplaintsBucketName:
    Description: S3 bucket for raw complaint storage
    Value: !Ref RawComplaintsBucket

  InsightsTableName:
    Description: DynamoDB table for structured insights
    Value: !Ref InsightsTable

  ComplaintEventsBusName:
    Description: EventBridge bus for complaint lifecycle events
    Value: !Ref ComplaintEventsBus

  BedrockGuardrailId:
    Description: Stack-managed Bedrock guardrail ID for live analyzer deployments
    Value: !If
      - CreateBedrockGuardrail
      - !GetAtt WorkshopBedrockGuardrailVersion.GuardrailId
      - ""

  BedrockGuardrailVersion:
    Description: Stack-managed Bedrock guardrail version for live analyzer deployments
    Value: !If
      - CreateBedrockGuardrail
      - !GetAtt WorkshopBedrockGuardrailVersion.Version
      - ""
